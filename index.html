<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বরমচাল ইউনিয়ন এনসিপি – যোগদান ফর্ম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0e5a3a;--dark:#062f1f;--red:#c0282a;--gold:#f6c343;--cream:#fff8e7;--ink:#1a1a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:"Hind Siliguri",system-ui,sans-serif;color:var(--cream);background:linear-gradient(160deg,var(--dark) 0%,var(--green) 55%,var(--red) 100%);background-attachment:fixed;padding:16px}
.wrap{max-width:520px;margin:0 auto}
header{text-align:center;padding:10px 0 18px}
header small{color:var(--gold);font-weight:700;font-size:15px}
h1{margin:6px 0 6px;font-size:30px;line-height:1.3}
header p{margin:0;font-size:16px;opacity:.9}
form{background:var(--cream);color:var(--ink);border-radius:14px;padding:20px 18px;border-top:6px solid var(--gold);box-shadow:0 8px 0 rgba(0,0,0,.25)}
label,.lbl{display:block;font-weight:700;margin:14px 0 6px;font-size:17px;color:var(--dark)}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:2px solid #b8c9bd;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);border-color:var(--green)}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600;font-size:16px;background:#e8f2ea;padding:8px 12px;border-radius:20px}
.chk input{accent-color:var(--red);width:18px;height:18px}
.btns{display:grid;gap:10px;margin-top:20px}
button{font:inherit;font-weight:700;font-size:18px;padding:14px;border:0;border-radius:8px;cursor:pointer}
.wa{background:var(--green);color:#fff}
.cp{background:var(--gold);color:var(--dark)}
.msg{margin-top:12px;font-size:15px;color:var(--red);font-weight:600;min-height:20px}
.note{font-size:13px;color:#555;margin-top:10px}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
<small>জাতীয় নাগরিক পার্টি (এনসিপি)</small>
<h1>বরমচাল ইউনিয়ন<br>যোগদান ফর্ম</h1>
<p>সততা, ন্যায় ও সম্প্রীতির নতুন বাংলাদেশ গড়তে আমাদের সঙ্গী হোন</p>
</header>
<form id="f" onsubmit="return false">
<label for="name">পূর্ণ নাম *</label>
<input type="text" id="name" autocomplete="name">
<label for="phone">মোবাইল নম্বর *</label>
<input type="tel" id="phone" autocomplete="tel">
<label for="age">বয়স</label>
<input type="number" id="age" min="10" max="100">
<label for="addr">ঠিকানা / গ্রাম / ওয়ার্ড *</label>
<input type="text" id="addr">
<label for="job">পেশা</label>
<select id="job"><option>ছাত্র/ছাত্রী</option><option>চাকরিজীবী</option><option>ব্যবসায়ী</option><option>কৃষক</option><option>চা শ্রমিক</option><option>অন্যান্য</option></select>
<label for="edu">শিক্ষাপ্রতিষ্ঠান (ছাত্র হলে)</label>
<input type="text" id="edu">
<div class="lbl">কোন উইংয়ে যুক্ত হতে চান? *</div>
<div class="chk" id="help">
<label><input type="radio" name="wing" value="যুবশক্তি">যুবশক্তি</label>
<label><input type="radio" name="wing" value="ছাত্রশক্তি">ছাত্রশক্তি</label>
<label><input type="radio" name="wing" value="এনসিপি">এনসিপি</label>
</div>
<label for="fb">ফেসবুক আইডি / লিংক (ঐচ্ছিক)</label>
<input type="text" id="fb">
<label for="why">কেন যোগ দিতে চান? (ঐচ্ছিক)</label>
<textarea id="why" rows="3"></textarea>
<div class="btns">
<button type="button" class="wa" id="sub">জমা দিন</button>
<button type="button" class="cp" id="wa">ইমেইলে পাঠান (বিকল্প)</button>
</div>
<div class="msg" id="msg" role="status"></div>
<div class="note">আপনার তথ্য বরমচাল ইউনিয়ন এনসিপির সংগঠকদের কাছে জমা হবে।</div>
</form>
</div>
<script>
var ORGANIZER_EMAIL = "baramchalunion.ncp@gmail.com";
var SHEET_URL = "https://script.google.com/macros/s/AKfycbwykib5MFiA-3DSqgmKq1LhRnzwmm_waiyiEgB6juca_7vbBfPassmyS1nli2Nb76A/exec";
function $(i){return document.getElementById(i)}
function val(){
  var n=$("name").value.trim(),p=$("phone").value.trim(),a=$("addr").value.trim();
  var w=document.querySelector("#help input:checked");
  if(!n||!p||!a||!w){$("msg").textContent="নাম, মোবাইল নম্বর, ঠিকানা ও উইং বাছাই আবশ্যক।";return null}
  $("msg").textContent="";
  return {name:n,phone:p,age:$("age").value,addr:a,job:$("job").value,edu:$("edu").value,wing:w.value,fb:$("fb").value,why:$("why").value};
}
$("sub").onclick=function(){
  var d=val(); if(!d) return;
  var btn=$("sub"); btn.disabled=true; btn.textContent="জমা হচ্ছে...";
  var body=new URLSearchParams(d).toString();
  fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body})
  .then(function(){
    $("msg").style.color="#0e5a3a";
    $("msg").textContent="ধন্যবাদ! আপনার তথ্য জমা হয়েছে। আমরা শীঘ্রই যোগাযোগ করব।";
    $("f").reset(); btn.textContent="জমা হয়েছে";
    setTimeout(function(){btn.disabled=false;btn.textContent="জমা দিন"},4000);
  })
  .catch(function(){
    $("msg").style.color="#c0282a";
    $("msg").textContent="জমা হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন বা ইমেইলে পাঠান।";
    btn.disabled=false; btn.textContent="জমা দিন";
  });
};
$("wa").onclick=function(){
  var d=val(); if(!d) return;
  var t="বরমচাল ইউনিয়ন এনসিপি – যোগদান\nনাম: "+d.name+"\nমোবাইল: "+d.phone+"\nবয়স: "+d.age+"\nঠিকানা: "+d.addr+"\nপেশা: "+d.job+"\nশিক্ষাপ্রতিষ্ঠান: "+d.edu+"\nউইং: "+d.wing+"\nফেসবুক: "+d.fb+"\nকারণ: "+d.why;
  window.location.href="mailto:"+ORGANIZER_EMAIL+"?subject="+encodeURIComponent("যোগদান – "+d.name)+"&body="+encodeURIComponent(t);
};
</script>
</body>
</html>
